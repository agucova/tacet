[package]
name = "tacet-wasm"
version = "0.4.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for tacet - timing side-channel detection"
keywords = ["security", "cryptography", "timing", "side-channel", "wasm"]
categories = ["cryptography", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.85"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
rand_xoshiro = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.18"
tsify = { version = "0.5.7", features = ["js"] }
wasm-bindgen = "0.2.108"

# Core analysis (no timing, just statistics)
tacet-core = { path = "../tacet-core", default-features = false, features = ["std"] }

# Pins the JS/Web Crypto backend for any getrandom user in the wasm dependency
# tree. getrandom >= 0.3.4 selects that backend from the `wasm_js` feature alone
# on wasm32-unknown-unknown; the `getrandom_backend` cfg in .cargo/config.toml
# keeps the selection explicit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.58"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
parallel = ["tacet-core/parallel"]
