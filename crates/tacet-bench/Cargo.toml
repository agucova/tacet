[package]
name = "tacet-bench"
version = "0.4.2"
edition = "2021"
description = "Benchmark comparison infrastructure for tacet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agucova/tacet"
homepage = "https://tacet.sh"
readme = "README.md"

[features]
default = ["parallel"]
parallel = ["rayon"]

[dependencies]
tacet = { path = "../tacet" }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
tempfile = "3.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
rayon = { version = "1.10", optional = true }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
num_cpus = "1.16"
aes = "0.8"
ring = "0.17"
chacha20poly1305 = "0.10"
sha3 = "0.10"
x25519-dalek = "2.0"
rsa = "0.9"
sodiumoxide = "0.2.7"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3.5"

[dev-dependencies]
