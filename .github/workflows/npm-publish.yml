name: npm Publish

on:
  push:
    tags:
      - 'js-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            strip: strip -x *.node

          # macOS x64
          - os: macos-13
            target: x86_64-apple-darwin
            strip: strip -x *.node

          # Linux x64 (glibc) - linked against the old glibc in @napi-rs/cross-toolchain
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_flags: '--use-napi-cross'
            strip: strip *.node

          # Linux ARM64 (glibc) - linked against the old glibc in @napi-rs/cross-toolchain
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_flags: '--use-napi-cross'
            setup: |
              sudo apt-get update
              sudo apt-get install -y binutils-aarch64-linux-gnu
            strip: aarch64-linux-gnu-strip *.node

          # Linux x64 (musl) - cross-compiled with cargo-zigbuild
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build_flags: '-x'
            strip: strip *.node

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            strip: ''

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/tacet-napi

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: napi-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # @napi-rs/cli v3 requires Node ^20.17.0 || ^22.13.0 || >=23.5.0 at build time
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # musl targets cross-compile through cargo-zigbuild (`napi build -x`)
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild

      - name: Setup cross-compilation
        if: matrix.setup
        run: ${{ matrix.setup }}

      - name: Install dependencies
        run: bun install

      - name: Build native module
        run: bun run build:native --target ${{ matrix.target }} ${{ matrix.build_flags }}

      - name: Strip binary
        if: matrix.strip
        run: ${{ matrix.strip }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/tacet-napi/*.node
          if-no-files-found: error
          retention-days: 1

  # Test on native platforms
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/tacet-napi
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/tacet-napi

      - name: Build TypeScript
        run: bun run build:ts

      - name: Run tests
        run: bun test
        timeout-minutes: 5

  # Publish to npm
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tacet-napi
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/tacet-napi/artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create per-platform npm directories
        run: bun x @napi-rs/cli create-npm-dirs

      - name: Move artifacts to npm directories
        run: bun x @napi-rs/cli artifacts --output-dir artifacts

      - name: List npm packages
        run: ls -la npm/

      - name: Build TypeScript
        run: bun run build:ts

      - name: Publish dry run
        if: inputs.dry_run == true
        run: |
          echo "=== Pre-publish validation ==="
          bun x @napi-rs/cli pre-publish -t npm --no-gh-release --skip-optional-publish --dry-run
          echo ""
          echo "=== Main package ==="
          npm pack --dry-run
          echo ""
          echo "=== Platform packages ==="
          for pkg in npm/*/; do
            echo "--- $pkg ---"
            (cd "$pkg" && npm pack --dry-run)
          done

      - name: Publish to npm
        if: inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Publish platform packages first
          for pkg in npm/*/; do
            echo "Publishing $pkg..."
            (cd "$pkg" && npm publish --access public --provenance)
          done

          # Publish main package
          echo "Publishing main package..."
          npm publish --access public --provenance
